name: Sync Organization Members to README

on:
  schedule:
    - cron: "0 0 * * *" # Daily at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-team:
    runs-on: ubuntu-latest
    name: Sync Org Members
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fetch and Format Organization Members
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const org = context.repo.owner;
            
            try {
              const { data: members } = await github.rest.orgs.listMembers({
                org: org,
                per_page: 100
              });

              if (!members || members.length === 0) {
                console.log('No members found or token lacks org scope.');
                return;
              }

              let html = '<div align="center">\n\n<table>\n<tr>\n';
              
              for (let i = 0; i < members.length; i++) {
                const member = members[i];
                if (i > 0 && i % 4 === 0) {
                  html += '</tr>\n<tr>\n';
                }
                
                const isFounder = member.login.toLowerCase() === 'uszkido';
                const roleTitle = isFounder ? 'Founder & Principal Engineer' : 'Core Engineer / Team Member';
                const badge = isFounder ? 'Lead_Architect-6E40C9' : 'Contributor-00F5FF';

                html += `<td align="center" width="25%">
  <a href="${member.html_url}">
    <img src="${member.avatar_url}" width="80" style="border-radius:50%"/>
    <br/>
    <sub><b>${member.login}</b></sub>
  </a>
  <br/>
  <small>${roleTitle}</small>
  <br/>
  <img src="https://img.shields.io/badge/Role-${badge}?style=flat-square"/>
</td>\n`;
              }
              
              html += '</tr>\n</table>\n\n</div>';

              const readmePath = 'profile/README.md';
              let content = fs.readFileSync(readmePath, 'utf8');

              const regex = /<!--START_SECTION:members-->[\s\S]*?<!--END_SECTION:members-->/;
              const updatedContent = content.replace(regex, `<!--START_SECTION:members-->\n${html}\n<!--END_SECTION:members-->`);

              fs.writeFileSync(readmePath, updatedContent, 'utf8');
              console.log('Updated profile/README.md with active organization members.');
            } catch (error) {
              console.error('Error fetching org members:', error);
            }

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-sync Vexel Innovations organization members in README"
          file_pattern: "profile/README.md"
